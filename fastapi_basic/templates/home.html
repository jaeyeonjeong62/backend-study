<!DOCTYPE html>
<!--
=====================================================================
  STEP 7. home.html - 앱 첫 화면
=====================================================================
 이 파일은 main.py 의 '/' 주소에서 보여 주는 HTML 화면입니다.
   main.py →  templates.TemplateResponse('home.html', ...)
              ↑ 바로 이 파일을 찾아서 브라우저에 보내 줍니다.

 HTML 이란?
   웹 페이지의 "뼈대"를 만드는 언어입니다.
   <태그> 내용 </태그> 처럼 여는 태그와 닫는 태그로 내용을 감쌉니다.

 📚 이 파일의 학습 순서
   7-1. 문서 종류 선언 (<!DOCTYPE html>)
   7-2. 전체를 감싸는 <html>
   7-3. 보이지 않는 정보 영역 <head>
   7-4. 화면에 보이는 영역 <body>
=====================================================================
-->

<!-- 7-1. 맨 첫 줄의 <!DOCTYPE html> 은
          "이 문서는 HTML5 문서입니다" 라고 브라우저에 알려 주는 선언입니다.
          (주석보다도 먼저, 항상 파일의 맨 첫 줄에 씁니다) -->

<!-- 7-2. html 문서 전체를 감싸는 태그
          lang="ko" : 이 페이지의 언어는 한국어라는 뜻 (검색엔진, 화면 낭독기에 도움) -->
<html lang="ko">

<!-- 7-3. head : 화면에는 보이지 않는 "페이지 설정 정보"를 적는 곳 -->
<head>
    <!-- 글자 인코딩 설정. UTF-8 이어야 한글이 깨지지 않습니다. -->
    <meta charset="UTF-8">

    <!-- 브라우저 "탭"에 표시되는 제목 (본문 화면에는 나오지 않아요) -->
    <title>마이 메모 앱에 오신 것을 환영합니다</title>
</head>

<!-- 7-4. body : 실제로 화면에 보이는 내용을 적는 곳 -->
<body>
    <!-- h1 : 가장 큰 제목 (h1 ~ h6 까지 있고, 숫자가 클수록 글자가 작아집니다) -->
    <h1>마이 앱에 오신 것을 환영합니다!</h1>

    <!-- p : 문단(paragraph). 일반 글을 적을 때 사용합니다. -->
    <p>문장을 바꾸고</p>

    <!--
    ✏️ 실습 과제
      [과제 A] <h2> 태그로 "오늘의 메모" 라는 소제목을 추가해 보세요.
      [과제 B] <a href="/about">소개 페이지로 이동</a> 링크를 추가하고 눌러 보세요.
               (main.py 의 '/about' 주소로 이동합니다!)
      [과제 C] <ul><li>할 일 1</li><li>할 일 2</li></ul> 로 목록을 만들어 보세요.
    -->
    <h2>오늘의 메모</h2>
    <a href="/about">소개 페이지로 이동</a>
    <ul><li>할 일 1</li><li>할 일 2</li></ul>
</body>
</html>
